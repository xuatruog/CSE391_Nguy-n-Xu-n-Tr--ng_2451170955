<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Multimedia - Giới thiệu Sản phẩm</title>
</head>
<body>

    <h1>Chào mừng đến với cửa hàng công nghệ của Trường</h1>

    <!-- 1. SVG Inline: Logo đơn giản -->
    <section>
        <h2>Logo thương hiệu</h2>
        <!-- Vẽ một hình vuông bo góc và chữ bên trong -->
        <svg width="100" height="100" viewBox="0 0 100 100">
            <rect x="10" y="10" width="80" height="80" rx="15" fill="#4CAF50" />
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="20">XT</text>
        </svg>
    </section>

    <!-- 2. Ảnh sản phẩm dùng <figure> + <figcaption> -->
    <section>
        <h2>Danh sách sản phẩm</h2>
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            
            <figure>
                <img src="https://picsum.photos/300/200" 
                     alt="Ảnh sản phẩm Laptop cấu hình mạnh mẽ" 
                     loading="lazy" 
                     style="max-width: 100%; height: auto; border: 1px solid #ccc;">
                <figcaption>Laptop Gaming Pro - 25.000.000đ</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/301/200" 
                     alt="Ảnh sản phẩm Điện thoại màn hình gập" 
                     loading="lazy" 
                     style="max-width: 100%; height: auto; border: 1px solid #ccc;">
                <figcaption>Smartphone Z Fold - 18.000.000đ</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/302/200" 
                     alt="Ảnh tai nghe chống ồn cao cấp" 
                     loading="lazy" 
                     style="max-width: 100%; height: auto; border: 1px solid #ccc;">
                <figcaption>Tai nghe Wireless ANC - 5.000.000đ</figcaption>
            </figure>
            
        </div>
    </section>

    <!-- 3. Video nhúng YouTube -->
    <section>
        <h2>Video Review sản phẩm (YouTube)</h2>
        <iframe width="560" height="315" 
                src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </section>

    <!-- 4. Thẻ <video> với poster và nhiều source -->
    <section>
        <h2>Clip giới thiệu cửa hàng</h2>
        <video controls poster="https://picsum.photos/560/315" width="560">
            <source src="movie.mp4" type="video/mp4">
            <source src="movie.webm" type="video/webm">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>
    </section>

    <!-- 5. Thẻ <audio> giới thiệu -->
    <section>
        <h2>Nghe lời chào từ cửa hàng</h2>
        <audio controls>
            <source src="intro.mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ thẻ audio.
        </audio>
    </section>

</body>
</html>
