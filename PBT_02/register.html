<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
</head>
<body>
    <form action="#" method="POST">
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <label for="fname">Họ tên:</label>
            <input type="text" id="fname" name="fname" required minlength="2" maxlength="50" placeholder="Nguyễn Văn A"><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="example@gmail.com"><br><br>
            
            <label for="tel">Số điện thoại:</label>
            <input type="tel" id="tel" name="tel" pattern="[0-9]{10}" placeholder="0987654321"><br><br>
            
            <label for="dob">Ngày sinh:</label>
            <input type="date" id="dob" name="dob" max="2026-05-09"><br><br>
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>
            <label for="user">Username:</label>
            <input type="text" id="user" name="user" pattern="[A-Za-z0-9_]{3,20}" placeholder="user_123"><br><br>
            
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" placeholder="Ít nhất 1 hoa, 1 số"><br><br>
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <label for="city">Thành phố:</label>
            <select id="city" name="city">
                <option value="hn">Hà Nội</option>
                <option value="hcm">TP.HCM</option>
                <option value="dn">Đà Nẵng</option>
            </select><br><br>
            
            <label for="address">Địa chỉ chi tiết:</label>
            <textarea id="address" name="address" rows="3" placeholder="Số nhà, tên đường..."></textarea><br><br>
            
            <label>Giới tính:</label>
            <input type="radio" name="gender" value="m" id="m"> <label for="m">Nam</label>
            <input type="radio" name="gender" value="f" id="f"> <label for="f">Nữ</label>
        </fieldset>

        <input type="checkbox" id="terms" required>
        <label for="terms">Tôi đồng ý điều khoản</label><br><br>

        <button type="submit">Đăng ký</button>
        <button type="reset">Nhập lại</button>
    </form>
</body>
</html>
